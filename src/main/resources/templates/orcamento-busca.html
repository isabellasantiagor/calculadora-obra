<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Buscar Orçamento</title>
    <style>
        body { font-family: Arial, sans-serif; max-width:500px; margin:40px auto; padding:0 20px; }
        fieldset { border:1px solid #ddd; border-radius:8px; padding:16px; margin-bottom:16px; }
        input { padding:8px; width:70%; border:1px solid #ccc; border-radius:4px; }
        button { padding:8px 14px; border:none; border-radius:4px; background:#2c7be5; color:#fff; cursor:pointer; }
        .erro { color:#c0392b; margin-top:10px; }
    </style>
</head>
<body>
<h1>Buscar orçamento</h1>
<div class="erro" th:if="${erro}" th:text="${erro}"></div>

<fieldset>
    <legend>Por número</legend>
    <form th:action="@{/orcamentos/buscar/numero}" method="get">
        <input type="number" name="numero" placeholder="Ex: 1" required>
        <button type="submit">Buscar</button>
    </form>
</fieldset>

<fieldset>
    <legend>Por nome do cliente</legend>
    <form th:action="@{/orcamentos/buscar/nome}" method="get">
        <input type="text" name="nome" placeholder="Ex: Maria" required>
        <button type="submit">Buscar</button>
    </form>
</fieldset>

<a th:href="@{/orcamentos/novo}">&larr; Novo orçamento</a>
</body>
</html>
